name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read


jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22.x", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # spec/ is the websitescreenshotworld-spec submodule: the shared cases and the conformance server.
          submodules: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        if: matrix.go == 'stable'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: Test
        run: go test -race ./...

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Check that the tag matches version.go
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' version.go)"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match Version \"$version\" in version.go" >&2
            exit 1
          fi

      # Go modules are published by the tag itself. Asking the public proxy for the new version makes it
      # available at once and lists it on pkg.go.dev.
      - name: Announce the version to the Go module proxy
        working-directory: ${{ runner.temp }}
        env:
          GOPROXY: https://proxy.golang.org
        run: go list -m "github.com/websitescreenshotworld/websitescreenshotworld-go@${GITHUB_REF_NAME}"
